name: Update README with latest posts

on:
  schedule:
    # Runs once a day at 00:00 UTC. Change the cron expression if you want a different cadence.
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main               # also refresh whenever you push (e.g. right after publishing a new article)

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest posts into README
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: "BLOG-POST-LIST"
          feed_list: "https://medium.com/feed/@madebyabder"
          max_post_count: 5
          date_format: "MMM DD, YYYY"
